/*
 * subscription-commons -- shared utilities, leaf of the dependency graph.
 * No agent declarations; no internal sibling dependencies.
 */
dependencies {
  testImplementation platform('org.junit:junit-bom:5.11.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}
